<!--
  Sent by signInWithOtp({ email, options: { shouldCreateUser: true } }) when the
  account does not exist yet (Create account page).

  Must reference the Token field and must NOT reference the ConfirmationURL
  field, for the same reason as magic_link.html — otherwise new users get a
  click-to-confirm link while the UI waits for a 6-digit code. Do not name the
  ConfirmationURL field here even inside a comment; Go renders template
  expressions in comments too.
-->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#F6F8FE;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:480px;background:#FFFFFF;border:1px solid #DCE4F5;border-radius:20px;padding:32px;">
        <tr>
          <td align="center" style="padding-bottom:20px;font-size:17px;font-weight:500;color:#0F2250;letter-spacing:-0.3px;">
            CAREVIA
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:8px;font-size:22px;font-weight:300;color:#0F2250;letter-spacing:-0.6px;">
            Confirm your email
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;font-size:14px;line-height:1.5;color:#2C3A5E;">
            Enter this code to finish creating your CAREVIA account.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <div style="display:inline-block;background:#E3EBFB;border-radius:16px;padding:18px 32px;font-size:32px;font-weight:500;color:#0F2250;letter-spacing:0.22em;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:13px;line-height:1.6;color:#2C3A5E;">
            This code expires shortly and can be used once.<br />
            If you didn't request it, you can safely ignore this email.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:24px;border-top:1px solid #DCE4F5;font-size:11px;color:#2C3A5E;">
            Protected by encrypted privacy and role-based permissions.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
